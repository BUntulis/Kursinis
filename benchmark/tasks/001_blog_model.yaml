id: 001_blog_model
title: Blog post modelis su autoriumi ir tagais
difficulty: easy
category: models

description: |
  Sukurk Django aplikaciją `blog` su dviem modeliais: `Tag` ir `BlogPost`.

  Tikslas:
    - Turinio komanda turi galėti saugoti tinklaraščio įrašus, priskirti juos autoriui ir pažymėti tagais.

  Modelis `Tag`:
    - `name`: `CharField`, `max_length=50`, `unique=True`.
    - `__str__` grąžina `name`.
    - `clean()` turi atmesti tuščią arba tik tarpų reikšmę.

  Modelis `BlogPost`:
    - `title`: `CharField`, `max_length=200`.
    - `slug`: `SlugField`, `unique=True`.
    - `body`: `TextField`.
    - `author`: `ForeignKey` į `settings.AUTH_USER_MODEL`, `on_delete=CASCADE`, `related_name="posts"`.
    - `tags`: `ManyToManyField` į `Tag`, `blank=True`.
    - `created_at`: `DateTimeField(auto_now_add=True)`.
    - `updated_at`: `DateTimeField(auto_now=True)`.
    - `__str__` grąžina `title`.
    - `Meta.ordering = ["-created_at"]`.
    - `clean()` turi atmesti tuščią arba tik tarpų `title`, `slug` ir `body`.

  Apribojimai:
    - Nenaudok hardcodintų vartotojų, tagų ar pradinių duomenų.
    - Neapeik Django validacijos ir DB unikalumo apribojimų.
    - Modeliai turi būti tinkami migracijoms ir veikti su custom `AUTH_USER_MODEL`.

expected_files:
  - blog/models.py

expected_implementation_summary: |
  Teisingas sprendimas apibrėžia idiomatiškus `Tag` ir `BlogPost` modelius su nurodytais laukais, ryšiais, `__str__`, `Meta.ordering`, DB unikalumu, kaskadiniu autoriaus trynimu ir modelio lygio `clean()` validacija tuščioms reikšmėms.

unit_test_plan:
  - Patikrinti modelių laukus, `max_length`, `unique`, `blank` ir ryšių `related_name`.
  - Patikrinti `__str__`, tagų priskyrimą ir autoriaus reverse ryšį.
  - Patikrinti slug unikalumą per DB vientisumo klaidą.
  - Patikrinti autoriaus trynimo kaskadą.
  - Patikrinti `Meta.ordering` ir modelio `clean()` validaciją tuščioms reikšmėms.

