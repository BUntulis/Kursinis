reference_tests: |
  import pytest
  from django.contrib.auth import get_user_model
  from django.core.exceptions import ValidationError
  from django.db import IntegrityError
  from blog.models import BlogPost, Tag

  pytestmark = pytest.mark.django_db

  def make_user(username="alice"):
      return get_user_model().objects.create_user(username=username, password="x")

  def test_model_field_contracts():
      assert Tag._meta.get_field("name").max_length == 50
      assert Tag._meta.get_field("name").unique is True
      assert BlogPost._meta.get_field("title").max_length == 200
      assert BlogPost._meta.get_field("slug").unique is True
      assert BlogPost._meta.get_field("author").remote_field.related_name == "posts"
      assert BlogPost._meta.get_field("tags").blank is True
      assert BlogPost._meta.ordering == ["-created_at"]

  def test_blogpost_creation_and_tags():
      user = make_user()
      tag = Tag.objects.create(name="django")
      post = BlogPost.objects.create(title="Hello", slug="hello", body="World", author=user)
      post.tags.add(tag)
      assert str(tag) == "django"
      assert str(post) == "Hello"
      assert user.posts.get() == post
      assert list(post.tags.all()) == [tag]

  def test_slug_unique_constraint():
      user = make_user()
      BlogPost.objects.create(title="A", slug="same", body="Body", author=user)
      with pytest.raises(IntegrityError):
          BlogPost.objects.create(title="B", slug="same", body="Body", author=user)

  def test_author_delete_cascades_posts():
      user = make_user()
      BlogPost.objects.create(title="A", slug="a", body="Body", author=user)
      user.delete()
      assert BlogPost.objects.count() == 0

  def test_whitespace_title_rejected_by_model_validation():
      post = BlogPost(title="   ", slug="valid-slug", body="Body", author=make_user())
      with pytest.raises(ValidationError):
          post.full_clean()
