reference_tests: |
  import pytest
  from decimal import Decimal
  from io import StringIO
  from django.core.management import call_command
  from django.core.management.base import CommandError
  from inventory.models import Product

  pytestmark = pytest.mark.django_db

  def test_model_contract():
      assert Product._meta.get_field("sku").max_length == 32
      assert Product._meta.get_field("sku").unique is True
      assert Product._meta.get_field("price").decimal_places == 2
      assert str(Product(sku="A1", name="Apple", price=Decimal("1.50"), stock=10)) == "A1"

  def test_import_creates_products(tmp_path):
      csv_file = tmp_path / "products.csv"
      csv_file.write_text("sku,name,price,stock\nA1,Apple,1.50,10\nB2,Banana,0.75,20\n", encoding="utf-8")
      out = StringIO()
      call_command("import_products", str(csv_file), stdout=out)
      assert Product.objects.count() == 2
      assert Product.objects.get(sku="A1").price == Decimal("1.50")
      assert "Imported 2, updated 0" in out.getvalue()

  def test_import_updates_existing(tmp_path):
      Product.objects.create(sku="A1", name="Old", price=Decimal("1.00"), stock=5)
      csv_file = tmp_path / "products.csv"
      csv_file.write_text("sku,name,price,stock\nA1,New,2.00,99\n", encoding="utf-8")
      out = StringIO()
      call_command("import_products", str(csv_file), stdout=out)
      product = Product.objects.get(sku="A1")
      assert product.name == "New"
      assert product.stock == 99
      assert "Imported 0, updated 1" in out.getvalue()

  def test_invalid_header_raises_command_error(tmp_path):
      csv_file = tmp_path / "bad.csv"
      csv_file.write_text("sku,name,price\nA1,Apple,1.50\n", encoding="utf-8")
      with pytest.raises(CommandError):
          call_command("import_products", str(csv_file), stdout=StringIO())

  def test_invalid_row_rolls_back_import(tmp_path):
      csv_file = tmp_path / "bad-row.csv"
      csv_file.write_text("sku,name,price,stock\nA1,Apple,1.50,10\nB2,Banana,0.75,-1\n", encoding="utf-8")
      with pytest.raises(CommandError):
          call_command("import_products", str(csv_file), stdout=StringIO())
      assert Product.objects.count() == 0

  def test_missing_file_raises_command_error(tmp_path):
      with pytest.raises(CommandError):
          call_command("import_products", str(tmp_path / "missing.csv"), stdout=StringIO())
