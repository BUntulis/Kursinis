id: 006_management_command
title: Django management command duomenų importavimui
difficulty: medium
category: commands

description: |
  Sukurk `inventory` aplikaciją su produktų importavimo komanda.

  Tikslas:
    - Sandėlio komanda turi galėti saugiai importuoti produktus iš CSV ir atnaujinti esamus įrašus pagal SKU.

  Modelis `Product`:
    - `sku`: `CharField(max_length=32, unique=True)`.
    - `name`: `CharField(max_length=200)`.
    - `price`: `DecimalField(max_digits=10, decimal_places=2)`.
    - `stock`: `IntegerField(default=0)`.
    - `__str__` grąžina `sku`.

  Management command `import_products`:
    - Failas: `inventory/management/commands/import_products.py`.
    - Priima positional argumentą `csv_path`.
    - CSV antraštė turi būti tiksliai: `sku,name,price,stock`.
    - Naudoja `csv.DictReader`.
    - Kiekvienai eilutei validuoja:
        * `sku` ir `name` netušti.
        * `price` yra `Decimal` ir nėra neigiamas.
        * `stock` yra sveikasis skaičius ir nėra neigiamas.
    - Naudoja `transaction.atomic()`, kad klaida nepaliktų dalinio importo.
    - Naudoja `Product.objects.update_or_create(sku=..., defaults=...)`.
    - Pabaigoje į stdout rašo tiksliai: `Imported X, updated Y`.
    - Netinkamam failui, antraštei ar eilutei kelia `CommandError`.

  Apribojimai:
    - Nenaudok pandas ar išorinių priklausomybių.
    - Neignoruok klaidingų eilučių tyliai.
    - Nenaudok float kainoms saugoti.

expected_files:
  - inventory/models.py
  - inventory/management/__init__.py
  - inventory/management/commands/__init__.py
  - inventory/management/commands/import_products.py

expected_implementation_summary: |
  Teisingas sprendimas pateikia `Product` modelį ir patikimą Django management command, kuri skaito CSV, validuoja antraštes ir eilučių reikšmes, importuoja arba atnaujina produktus per `update_or_create`, skaičiuoja sukurtus ir atnaujintus įrašus bei naudoja `CommandError` ir `transaction.atomic()`.

unit_test_plan:
  - Patikrinti modelio laukus, unikalų SKU ir `__str__`.
  - Patikrinti naujų produktų importą ir stdout santrauką.
  - Patikrinti esamų produktų atnaujinimą.
  - Patikrinti netinkamą antraštę, neigiamas reikšmes ir trūkstamą failą.
  - Patikrinti, kad klaidos atveju neįvyksta dalinis importas.

