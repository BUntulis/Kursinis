id: 005_signals
title: Django signal po User sukūrimo sukuriantis Profile
difficulty: medium
category: signals

description: |
  Sukurk aplikaciją `profiles`, kuri automatiškai sukuria vartotojo profilį.

  Tikslas:
    - Kiekvienas naujai sukurtas vartotojas turi turėti tiksliai vieną `Profile`.

  Modelis `Profile`:
    - `user`: `OneToOneField(settings.AUTH_USER_MODEL, on_delete=CASCADE, related_name="profile")`.
    - `bio`: `TextField(blank=True)`.
    - `avatar_url`: `URLField(blank=True)`.
    - `__str__` grąžina vartotojo identifikatorių arba el. paštą, jei toks yra.

  Signalai:
    - Faile `profiles/signals.py` naudok `post_save` signalą.
    - Kai vartotojas sukuriamas (`created=True`), automatiškai sukurk tuščią `Profile`.
    - Signalas neturi kurti antro profilio, kai vartotojas tik atnaujinamas.

  App config:
    - Faile `profiles/apps.py` sukurk `ProfilesConfig`.
    - `ProfilesConfig.ready()` importuoja `profiles.signals`.

  Apribojimai:
    - Nenaudok signalų importo modelio failo apačioje kaip vienintelio pajungimo būdo.
    - Nenaudok hardcodintų vartotojų.
    - Ryšys turi veikti su custom `AUTH_USER_MODEL`.

expected_files:
  - profiles/models.py
  - profiles/signals.py
  - profiles/apps.py

expected_implementation_summary: |
  Teisingas sprendimas turi `Profile` modelį su one-to-one ryšiu į aktyvų vartotojo modelį, `post_save` signalą, kuris kuria profilį tik naujam vartotojui, ir `AppConfig.ready()` pajungimą, todėl signalas veikia sandbox bei realiame projekte.

unit_test_plan:
  - Patikrinti `Profile` laukus, `related_name`, `blank` ir `__str__`.
  - Patikrinti, kad naujas vartotojas automatiškai gauna profilį.
  - Patikrinti, kad vartotojo atnaujinimas nekuria dublikato.
  - Patikrinti one-to-one unikalumą ir vartotojo trynimo kaskadą.
  - Patikrinti, kad signalai importuojami per app config.

