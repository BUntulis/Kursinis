reference_tests: |
  import pytest
  from django.contrib.auth import get_user_model
  from django.db import IntegrityError
  from profiles.models import Profile

  pytestmark = pytest.mark.django_db

  def test_profile_model_contract():
      field = Profile._meta.get_field("user")
      assert field.remote_field.related_name == "profile"
      assert Profile._meta.get_field("bio").blank is True
      assert Profile._meta.get_field("avatar_url").blank is True

  def test_profile_auto_created():
      user = get_user_model().objects.create_user("alice", password="x")
      assert Profile.objects.filter(user=user).exists()
      assert user.profile.bio == ""
      assert user.profile.avatar_url == ""

  def test_user_update_does_not_create_duplicate_profile():
      user = get_user_model().objects.create_user("bob", password="x")
      user.first_name = "Bob"
      user.save()
      assert Profile.objects.filter(user=user).count() == 1

  def test_profile_one_to_one_is_enforced():
      user = get_user_model().objects.create_user("carol", password="x")
      with pytest.raises(IntegrityError):
          Profile.objects.create(user=user)

  def test_user_delete_cascades_profile():
      user = get_user_model().objects.create_user("dan", password="x")
      profile_id = user.profile.id
      user.delete()
      assert not Profile.objects.filter(id=profile_id).exists()
