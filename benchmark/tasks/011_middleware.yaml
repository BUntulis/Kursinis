reference_tests: |
  import pytest
  from unittest.mock import patch
  from django.http import HttpResponse
  from django.test import RequestFactory
  from tracking.middleware import RequestTimingMiddleware

  def test_middleware_adds_integer_header():
      def view(request):
          return HttpResponse("ok")
      response = RequestTimingMiddleware(view)(RequestFactory().get("/"))
      assert "X-Response-Time-Ms" in response
      assert response["X-Response-Time-Ms"].isdigit()

  def test_middleware_uses_perf_counter_for_milliseconds():
      def view(request):
          return HttpResponse("ok")
      with patch("tracking.middleware.time.perf_counter", side_effect=[10.0, 10.042]):
          response = RequestTimingMiddleware(view)(RequestFactory().get("/"))
      assert response["X-Response-Time-Ms"] == "42"

  def test_response_passthrough_body_and_status():
      def view(request):
          return HttpResponse("hello", status=201)
      response = RequestTimingMiddleware(view)(RequestFactory().get("/"))
      assert response.status_code == 201
      assert response.content == b"hello"

  def test_exceptions_are_not_swallowed():
      def view(request):
          raise RuntimeError("boom")
      with pytest.raises(RuntimeError):
          RequestTimingMiddleware(view)(RequestFactory().get("/"))
