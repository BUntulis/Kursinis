id: 007_class_based_views
title: Class-based views (ListView, DetailView)
difficulty: easy
category: views

description: |
  Sukurk `articles` aplikaciją su publikuotų straipsnių peržiūra.

  Tikslas:
    - Lankytojai turi matyti tik publikuotus straipsnius sąraše ir detalėje.

  Modelis `Article`:
    - `title`: `CharField(max_length=200)`.
    - `slug`: `SlugField(unique=True)`.
    - `content`: `TextField`.
    - `is_published`: `BooleanField(default=False)`.
    - `__str__` grąžina `title`.

  Vaizdai:
    - `ArticleListView(ListView)`:
        * `model = Article`.
        * `paginate_by = 10`.
        * `context_object_name = "articles"`.
        * QuerySet filtruoja tik `is_published=True`.
        * Rikiuoja pagal `-id`.
    - `ArticleDetailView(DetailView)`:
        * `model = Article`.
        * `slug_url_kwarg = "slug"`.
        * Detalė taip pat pasiekiama tik publikuotiems straipsniams.

  URL:
    - `/articles/` -> `ArticleListView`, `name="article-list"`.
    - `/articles/<slug:slug>/` -> `ArticleDetailView`, `name="article-detail"`.

  Šablonai:
    - `articles/templates/articles/article_list.html`.
    - `articles/templates/articles/article_detail.html`.
    - Šablonai turi atvaizduoti straipsnių pavadinimus be hardcodintų duomenų.

expected_files:
  - articles/models.py
  - articles/views.py
  - articles/urls.py
  - articles/templates/articles/article_list.html
  - articles/templates/articles/article_detail.html

expected_implementation_summary: |
  Teisingas sprendimas pateikia `Article` modelį, `ListView` ir `DetailView`, kurie abu filtruoja nepublikuotus straipsnius, naudoja slug maršrutus, paginaciją, tvarkingą kontekstą ir realius Django šablonus.

unit_test_plan:
  - Patikrinti modelio laukus ir `__str__`.
  - Patikrinti URL reverse ir HTTP statusus.
  - Patikrinti, kad sąraše ir detalėje nerodomi nepublikuoti straipsniai.
  - Patikrinti rikiavimą, konteksto vardą ir paginaciją.
  - Patikrinti, kad nežinomas arba nepublikuotas slug grąžina 404.

