reference_tests: |
  import pytest
  from django.test import Client
  from django.urls import reverse
  from articles.models import Article

  pytestmark = pytest.mark.django_db

  @pytest.fixture
  def client():
      return Client()

  def test_model_contract():
      assert Article._meta.get_field("title").max_length == 200
      assert Article._meta.get_field("slug").unique is True
      assert Article._meta.get_field("is_published").default is False
      assert str(Article(title="Hello", slug="hello", content="World")) == "Hello"

  def test_list_only_published_with_context_and_order(client):
      first = Article.objects.create(title="First", slug="first", content="...", is_published=True)
      hidden = Article.objects.create(title="Hidden", slug="hidden", content="...", is_published=False)
      second = Article.objects.create(title="Second", slug="second", content="...", is_published=True)
      resp = client.get(reverse("article-list"))
      assert resp.status_code == 200
      assert list(resp.context["articles"]) == [second, first]
      assert hidden not in resp.context["articles"]
      assert b"Second" in resp.content
      assert b"Hidden" not in resp.content

  def test_detail_only_published(client):
      Article.objects.create(title="Hello", slug="hello", content="World", is_published=True)
      Article.objects.create(title="Draft", slug="draft", content="Secret", is_published=False)
      ok = client.get(reverse("article-detail", kwargs={"slug": "hello"}))
      missing = client.get(reverse("article-detail", kwargs={"slug": "draft"}))
      assert ok.status_code == 200
      assert b"Hello" in ok.content
      assert missing.status_code == 404

  def test_detail_404_for_unknown(client):
      resp = client.get("/articles/missing/")
      assert resp.status_code == 404

  def test_pagination_enabled(client):
      for index in range(11):
          Article.objects.create(title=f"A{index}", slug=f"a{index}", content="...", is_published=True)
      resp = client.get("/articles/")
      assert resp.status_code == 200
      assert resp.context["is_paginated"] is True
      assert len(resp.context["articles"]) == 10
